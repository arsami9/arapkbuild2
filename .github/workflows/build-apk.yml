# AR APK BUILD — Real Release APK builder (v2)
# Triggered via workflow_dispatch by the Cloudflare Worker (which first
# verifies the caller's Firebase ID token). Builds and signs a release APK
# with the keystore stored in repo Secrets.
#
# Project types (input project_type):
#   webview  Capacitor app that loads start_url (URL required)
#   html     Capacitor app that bundles the project's own files, which the
#            Worker committed under builds/<build_id>/ before dispatching
#   blank    Capacitor app with only the built-in fallback page
#   native   Real native compile: the project's Kotlin/Java sources are
#            compiled with a minimal Gradle/AGP scaffold (job build-native)
#
# Required repo Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of your release keystore (.jks / .keystore)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password (for the PKCS12 keystore = store password)
# NO secrets are ever committed to this repo.

name: build-apk
run-name: build-${{ inputs.build_id }}

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID generated by the Worker"
        required: true
        type: string
      app_name:
        description: "App display name"
        required: true
        type: string
      package_name:
        description: "Android package / Capacitor appId, e.g. com.company.app"
        required: true
        type: string
      start_url:
        description: "Website URL the app loads (WebView type only; optional otherwise)"
        required: false
        default: ""
        type: string
      version_name:
        description: "versionName, e.g. 1.0.0"
        required: false
        default: "1.0.0"
        type: string
      version_code:
        description: "versionCode (integer)"
        required: false
        default: "1"
        type: string
      permissions:
        description: "Extra Android permissions, comma separated (full names, e.g. android.permission.CAMERA)"
        required: false
        default: ""
        type: string
      icon_url:
        description: "Optional 1024x1024 PNG icon URL (empty = default icon)"
        required: false
        default: ""
        type: string
      project_type:
        description: "webview | html | blank | native"
        required: false
        default: "webview"
        type: string
      language:
        description: "Native projects: kotlin | java"
        required: false
        default: "kotlin"
        type: string

permissions:
  contents: write

jobs:
  build:
    if: ${{ inputs.project_type != 'native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          # ubuntu-latest runners already ship an Android SDK ($ANDROID_HOME).
          # android-actions/setup-android@v3 is NOT used: it tries to install
          # the legacy "tools" package, which current SDK repos no longer
          # carry ("Failed to find package 'tools'"). Install directly instead.
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          # Target SDK chosen in the build form (default 34): its platform
          # and build-tools must exist before Gradle configures the project.
          TGT=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/builds/$BUILD_ID/__config.json')).get('targetSdk',34))" 2>/dev/null || echo 34)
          if [ "$TGT" != "34" ]; then "$SDKMANAGER" "platforms;android-$TGT" "build-tools;$TGT.0.0"; fi
        env:
          BUILD_ID: ${{ inputs.build_id }}

      - name: Scaffold Capacitor project
        shell: bash
        run: |
          set -euo pipefail
          mkdir work && cd work
          npm init -y >/dev/null
          npm install @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6
          mkdir -p web
          # Local fallback page (also the whole app for the blank type).
          cat > web/index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Loading…</title></head>
          <body style="font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">
          <p>Loading… please check your internet connection.</p></body></html>
          HTML
          # HTML type: the app's real content is the project's own files,
          # which the Worker committed under builds/<build_id>/.
          if [ "$PTYPE" = "html" ]; then
            SRC="$GITHUB_WORKSPACE/builds/$BUILD_ID"
            [ -d "$SRC" ] || { echo "ERROR: no project files found at builds/$BUILD_ID"; exit 1; }
            cp -r "$SRC"/. web/
            [ -f web/index.html ] || { echo "ERROR: an HTML/CSS/JS project needs an index.html file"; exit 1; }
            echo "Bundled project files:"; find web -type f | head -50
          fi
          # Custom CSS/JS from the build form are injected into the bundled
          # index.html (html/blank types). Reserved Worker files (__*) never
          # ship inside the app.
          python3 - <<'PY'
          import os, pathlib
          builds = pathlib.Path(os.environ["BUILDS_DIR"])
          web = pathlib.Path("web")
          css = ""
          js = ""
          if (builds / "__custom.css").exists():
              css = (builds / "__custom.css").read_text()
          if (builds / "__custom.js").exists():
              js = (builds / "__custom.js").read_text()
          idx = web / "index.html"
          if idx.exists() and (css or js):
              h = idx.read_text(errors="ignore")
              if css:
                  tag = "<style data-arapk>\n" + css.replace("</style", "<\\/style") + "\n</style>"
                  h = h.replace("</head>", tag + "</head>", 1) if "</head>" in h else tag + h
              if js:
                  tag = "<script data-arapk>\n" + js.replace("</script", "<\\/script") + "\n</script>"
                  h = h.replace("</body>", tag + "</body>", 1) if "</body>" in h else h + tag
              idx.write_text(h)
              print("Injected custom CSS/JS into index.html")
          for f in web.glob("__*"):
              if f.is_file():
                  f.unlink()
          PY
          # capacitor.config.json is generated from dispatch inputs. The
          # Website URL is OPTIONAL: server.url is set only when one was
          # given; otherwise the app serves the bundled web files.
          node -e '
            const fs = require("fs");
            const cfg = {
              appId: process.env.PKG,
              appName: process.env.APP_NAME,
              webDir: "web"
            };
            if (process.env.START_URL) {
              cfg.server = { url: process.env.START_URL, cleartext: false, androidScheme: "https" };
            }
            try {
              const bc = JSON.parse(fs.readFileSync(process.env.CFG_PATH, "utf8"));
              if (bc.userAgent) cfg.overrideUserAgent = bc.userAgent;
            } catch (e) {}
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '
          npx cap add android
          npx cap sync android
        env:
          PKG: ${{ inputs.package_name }}
          APP_NAME: ${{ inputs.app_name }}
          START_URL: ${{ inputs.start_url }}
          PTYPE: ${{ inputs.project_type }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILDS_DIR: ${{ github.workspace }}/builds/${{ inputs.build_id }}
          CFG_PATH: ${{ github.workspace }}/builds/${{ inputs.build_id }}/__config.json

      - name: Apply name, version, permissions, icon
        shell: bash
        run: |
          set -euo pipefail
          cd work
          # App display name
          python3 - <<'PY'
          import os, re, pathlib
          name = os.environ["APP_NAME"].replace("&","&amp;").replace("<","&lt;").replace('"',"&quot;")
          p = pathlib.Path("android/app/src/main/res/values/strings.xml")
          s = p.read_text()
          s = re.sub(r'(<string name="app_name">).*?(</string>)', r'\g<1>'+name+r'\g<2>', s)
          s = re.sub(r'(<string name="title_activity_main">).*?(</string>)', r'\g<1>'+name+r'\g<2>', s)
          p.write_text(s)
          # versionName / versionCode
          g = pathlib.Path("android/app/build.gradle")
          t = g.read_text()
          t = re.sub(r'versionCode\s+\d+', 'versionCode ' + os.environ["VCODE"], t)
          t = re.sub(r'versionName\s+"[^"]*"', 'versionName "' + os.environ["VNAME"] + '"', t)
          g.write_text(t)
          PY
          # Extra permissions into AndroidManifest.xml
          if [ -n "${{ inputs.permissions }}" ]; then
            python3 - <<'PY'
          import os, pathlib
          perms = [x.strip() for x in os.environ["PERMS"].split(",") if x.strip()]
          p = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          add = "".join(f'    <uses-permission android:name="{x}" />\n' for x in perms if x not in s)
          s = s.replace("<application", add + "    <application", 1)
          p.write_text(s)
          PY
          fi
          # Optional custom icon -> regenerate mipmap set. An icon uploaded
          # in the build form (committed by the Worker as __icon.img) wins
          # over the icon URL.
          ICON_SRC=""
          if [ -f "$BUILDS_DIR/__icon.img" ]; then ICON_SRC="$BUILDS_DIR/__icon.img";
          elif [ -n "${{ inputs.icon_url }}" ]; then curl -fsSL "${{ inputs.icon_url }}" -o /tmp/icon.png; ICON_SRC=/tmp/icon.png; fi
          if [ -n "$ICON_SRC" ]; then
            cp "$ICON_SRC" /tmp/icon.png
            # Pillow is NOT preinstalled on ubuntu-latest runners — without
            # this the icon step fails with "ModuleNotFoundError: PIL".
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
          from PIL import Image
          import pathlib
          src = Image.open("/tmp/icon.png").convert("RGBA")
          sizes = {"mdpi":48, "hdpi":72, "xhdpi":96, "xxhdpi":144, "xxxhdpi":192}
          base = pathlib.Path("android/app/src/main/res")
          for dpi, px in sizes.items():
              d = base / f"mipmap-{dpi}"
              d.mkdir(parents=True, exist_ok=True)
              src.resize((px, px)).save(d / "ic_launcher.png")
              src.resize((px, px)).save(d / "ic_launcher_round.png")
              fg = base / f"mipmap-{dpi}" / "ic_launcher_foreground.png"
              src.resize((px, px)).save(fg)
          PY
          fi
          # SDK levels + orientation from the build form (__config.json).
          python3 - <<'PY'
          import json, os, pathlib, re
          cfg = {}
          cp = pathlib.Path(os.environ["CFG_PATH"])
          if cp.exists():
              cfg = json.loads(cp.read_text())
          min_sdk = max(22, int(cfg.get("minSdk", 22)))
          target_sdk = int(cfg.get("targetSdk", 34))
          v = pathlib.Path("android/variables.gradle")
          if v.exists():
              t = v.read_text()
              t = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = %d" % min_sdk, t)
              t = re.sub(r"compileSdkVersion\s*=\s*\d+", "compileSdkVersion = %d" % target_sdk, t)
              t = re.sub(r"targetSdkVersion\s*=\s*\d+", "targetSdkVersion = %d" % target_sdk, t)
              v.write_text(t)
          print("SDK levels: min", min_sdk, "target", target_sdk)
          orient = cfg.get("orientation", "auto")
          if orient in ("portrait", "landscape"):
              mp = pathlib.Path("android/app/src/main/AndroidManifest.xml")
              s = mp.read_text()
              def add_attr(m):
                  tag = m.group(0)
                  if "screenOrientation" in tag:
                      return tag
                  return tag.replace("<activity", '<activity android:screenOrientation="' + orient + '"', 1)
              s2 = re.sub(r"<activity\b[^>]*>", add_attr, s, count=1)
              if s2 != s:
                  mp.write_text(s2)
                  print("Orientation locked:", orient)
          PY
          # Splash screen image -> the density set Capacitor's launch theme
          # reads (res/drawable-*/splash.png).
          if [ -f "$BUILDS_DIR/__splash.img" ]; then
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
          import os, pathlib
          from PIL import Image
          src = Image.open(pathlib.Path(os.environ["BUILDS_DIR"]) / "__splash.img").convert("RGB")
          res = pathlib.Path("android/app/src/main/res")
          def crop_resize(img, w, h):
              s = max(w / img.width, h / img.height)
              im = img.resize((max(1, round(img.width * s)), max(1, round(img.height * s))))
              x = (im.width - w) // 2
              y = (im.height - h) // 2
              return im.crop((x, y, x + w, y + h))
          for dpi, s in {"mdpi": 1, "hdpi": 1.5, "xhdpi": 2, "xxhdpi": 3, "xxxhdpi": 4}.items():
              for o, (bw, bh) in (("port", (320, 480)), ("land", (480, 320))):
                  d = res / ("drawable-" + o + "-" + dpi)
                  d.mkdir(parents=True, exist_ok=True)
                  crop_resize(src, round(bw * s), round(bh * s)).save(d / "splash.png")
          (res / "drawable").mkdir(parents=True, exist_ok=True)
          crop_resize(src, 480, 800).save(res / "drawable" / "splash.png")
          print("Splash screen images generated")
          PY
          fi
          # MainActivity: status-bar color, WebView behavior toggles and the
          # Share/Rate bridge, generated from __config.json.
          python3 - <<'PY'
          import json, os, pathlib
          cfg = {}
          cp = pathlib.Path(os.environ["CFG_PATH"])
          if cp.exists():
              cfg = json.loads(cp.read_text())
          beh = cfg.get("behavior") or {}
          color = cfg.get("statusColor") or ""
          share_msg = cfg.get("shareMessage") or ""
          share_link = cfg.get("shareLink") or ""
          if not (color or share_msg or any(beh.values())):
              print("No MainActivity customization requested")
              raise SystemExit(0)
          pkg = os.environ["PKG"]
          def jstr(s):
              return '"' + s.replace("\\", "\\\\").replace('"', '\\"').replace("\n", " ").replace("\r", " ") + '"'
          imports = {"android.os.Bundle", "com.getcapacitor.BridgeActivity"}
          body = []
          body.append("    @Override")
          body.append("    public void onCreate(Bundle savedInstanceState) {")
          body.append("        super.onCreate(savedInstanceState);")
          body.append("        try {")
          if color:
              imports.add("android.graphics.Color")
              body.append('            getWindow().setStatusBarColor(Color.parseColor(' + jstr(color) + "));")
          if beh.get("fullscreen"):
              imports.add("android.view.WindowManager")
              body.append("            getWindow().addFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN);")
          body.append("            final android.webkit.WebView web = (getBridge() != null) ? getBridge().getWebView() : null;")
          body.append("            if (web != null) {")
          if beh.get("pinchZoom"):
              body.append("                web.getSettings().setSupportZoom(true);")
              body.append("                web.getSettings().setBuiltInZoomControls(true);")
              body.append("                web.getSettings().setDisplayZoomControls(false);")
          else:
              body.append("                web.getSettings().setSupportZoom(false);")
              body.append("                web.getSettings().setBuiltInZoomControls(false);")
          if beh.get("autoplay"):
              body.append("                web.getSettings().setMediaPlaybackRequiresUserGesture(false);")
          if beh.get("pcMode"):
              body.append('                web.getSettings().setUserAgentString("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36");')
          if not beh.get("longPress"):
              body.append("                web.setLongClickable(false);")
              body.append("                web.setOnLongClickListener(v -> true);")
          if beh.get("darkMode"):
              body.append("                if (android.os.Build.VERSION.SDK_INT >= 29) web.getSettings().setForceDark(android.webkit.WebSettings.FORCE_DARK_ON);")
          if share_msg:
              body.append('                web.addJavascriptInterface(new ShareBridge(this), "AndroidDownloader");')
          if beh.get("spinner") or beh.get("pullRefresh"):
              imports.update(["android.view.View", "android.view.ViewGroup"])
              body.append("                android.view.ViewGroup parent = (android.view.ViewGroup) web.getParent();")
              body.append("                if (parent != null) {")
              body.append("                    int idx = parent.indexOfChild(web);")
              body.append("                    parent.removeView(web);")
              inner = "web"
              if beh.get("pullRefresh"):
                  imports.add("androidx.swiperefreshlayout.widget.SwipeRefreshLayout")
                  body.append("                    androidx.swiperefreshlayout.widget.SwipeRefreshLayout srl = new androidx.swiperefreshlayout.widget.SwipeRefreshLayout(this);")
                  body.append("                    srl.addView(web, new android.view.ViewGroup.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.MATCH_PARENT));")
                  body.append("                    srl.setOnRefreshListener(() -> { web.reload(); srl.postDelayed(() -> srl.setRefreshing(false), 1500); });")
                  inner = "srl"
              if beh.get("spinner"):
                  imports.update(["android.os.Handler", "android.os.Looper", "android.widget.FrameLayout", "android.widget.ProgressBar"])
                  body.append("                    android.widget.FrameLayout fl = new android.widget.FrameLayout(this);")
                  body.append("                    fl.addView(" + inner + ", new android.widget.FrameLayout.LayoutParams(android.widget.FrameLayout.LayoutParams.MATCH_PARENT, android.widget.FrameLayout.LayoutParams.MATCH_PARENT));")
                  body.append("                    final android.widget.ProgressBar pb = new android.widget.ProgressBar(this);")
                  body.append("                    android.widget.FrameLayout.LayoutParams plp = new android.widget.FrameLayout.LayoutParams(android.widget.FrameLayout.LayoutParams.WRAP_CONTENT, android.widget.FrameLayout.LayoutParams.WRAP_CONTENT);")
                  body.append("                    plp.gravity = android.view.Gravity.CENTER;")
                  body.append("                    fl.addView(pb, plp);")
                  body.append("                    parent.addView(fl, idx, new android.view.ViewGroup.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.MATCH_PARENT));")
                  body.append("                    final android.os.Handler hh = new android.os.Handler(android.os.Looper.getMainLooper());")
                  body.append("                    final Object[] poll = new Object[1];")
                  body.append("                    poll[0] = new Runnable() { public void run() { if (web.getProgress() < 100) { hh.postDelayed((Runnable) poll[0], 200); } else { pb.setVisibility(android.view.View.GONE); } } };")
                  body.append("                    hh.postDelayed((Runnable) poll[0], 300);")
                  inner = "fl"
              if inner not in ("web", "fl"):
                  body.append("                    parent.addView(" + inner + ", idx, new android.view.ViewGroup.LayoutParams(android.view.ViewGroup.LayoutParams.MATCH_PARENT, android.view.ViewGroup.LayoutParams.MATCH_PARENT));")
              body.append("                }")
          body.append("            }")
          body.append("        } catch (Exception e) { /* build-form customization is best-effort */ }")
          if beh.get("exitConfirm"):
              imports.update(["androidx.activity.OnBackPressedCallback", "android.widget.Toast"])
              body.append("        getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {")
              body.append("            private long lastPress = 0;")
              body.append("            @Override public void handleOnBackPressed() {")
              body.append("                long t = System.currentTimeMillis();")
              body.append("                if (t - lastPress < 2000) { finish(); } else { lastPress = t; Toast.makeText(MainActivity.this, \"Press back again to exit\", Toast.LENGTH_SHORT).show(); }")
              body.append("            }")
              body.append("        });")
          body.append("    }")
          extra = ""
          if share_msg:
              imports.update(["android.content.Intent", "android.net.Uri"])
              extra = (
                  "\n    public static class ShareBridge {\n"
                  "        private final MainActivity act;\n"
                  "        private static final String MSG = " + jstr(share_msg) + ";\n"
                  "        private static final String LINK = " + jstr(share_link) + ";\n"
                  "        ShareBridge(MainActivity a) { this.act = a; }\n"
                  "        @android.webkit.JavascriptInterface\n"
                  "        public void shareApp() {\n"
                  "            act.runOnUiThread(() -> {\n"
                  "                Intent send = new Intent(Intent.ACTION_SEND);\n"
                  "                send.setType(\"text/plain\");\n"
                  "                send.putExtra(Intent.EXTRA_TEXT, LINK.isEmpty() ? MSG : MSG + \" \" + LINK);\n"
                  "                act.startActivity(Intent.createChooser(send, \"Share via\"));\n"
                  "            });\n"
                  "        }\n"
                  "        @android.webkit.JavascriptInterface\n"
                  "        public void rateApp() {\n"
                  "            act.runOnUiThread(() -> {\n"
                  "                try { act.startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(\"market://details?id=\" + act.getPackageName()))); }\n"
                  "                catch (Exception e) { act.startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(LINK.isEmpty() ? \"https://play.google.com/store/apps/details?id=\" + act.getPackageName() : LINK))); }\n"
                  "            });\n"
                  "        }\n"
                  "    }\n"
              )
          if beh.get("pullRefresh"):
              g = pathlib.Path("android/app/build.gradle")
              t = g.read_text()
              if "swiperefreshlayout" not in t:
                  t = t.replace("dependencies {", "dependencies {\n    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'", 1)
                  g.write_text(t)
          java = "package " + pkg + ";\n\n"
          java += "".join("import " + i + ";\n" for i in sorted(imports))
          java += "\npublic class MainActivity extends BridgeActivity {\n"
          java += "\n".join(body) + "\n"
          java += extra
          java += "}\n"
          dest = pathlib.Path("android/app/src/main/java/" + pkg.replace(".", "/") + "/MainActivity.java")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(java)
          print("MainActivity generated with build-form behavior")
          PY
        env:
          APP_NAME: ${{ inputs.app_name }}
          VNAME: ${{ inputs.version_name }}
          VCODE: ${{ inputs.version_code }}
          PERMS: ${{ inputs.permissions }}
          PKG: ${{ inputs.package_name }}
          BUILD_ID: ${{ inputs.build_id }}
          BUILDS_DIR: ${{ github.workspace }}/builds/${{ inputs.build_id }}
          CFG_PATH: ${{ github.workspace }}/builds/${{ inputs.build_id }}/__config.json

      - name: Inject release signing config
        shell: bash
        run: |
          set -euo pipefail
          cd work
          # Keystore source: the user's own keystore when the build form
          # sent one (__keystore.bin + __ks.json, committed by the Worker
          # and deleted again by the cleanup step), otherwise the site
          # release keystore from Secrets (decoded tolerantly — stray
          # whitespace from secret entry is stripped first). Either way the
          # credentials go to $GITHUB_ENV for the Gradle step, and the
          # keystore is proven HERE: a bad alias/password fails with a
          # clear message instead of a cryptic signing error later.
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, sys
          builds = pathlib.Path(os.environ["BUILDS_DIR"])
          cfg = {}
          cp = builds / "__config.json"
          if cp.exists():
              cfg = json.loads(cp.read_text())
          dest = pathlib.Path(os.environ["KS_DEST"])
          if cfg.get("keystoreMode") == "own" and (builds / "__keystore.bin").exists():
              ks = json.loads((builds / "__ks.json").read_text())
              dest.write_bytes((builds / "__keystore.bin").read_bytes())
              pw, alias, keypw = ks["storePassword"], ks["alias"], ks.get("keyPassword") or ks["storePassword"]
              print("Signing with the user's own keystore (alias " + alias + ")")
          else:
              dest.write_bytes(base64.b64decode("".join(os.environ["SECRET_KS_B64"].split())))
              pw, alias, keypw = os.environ["SECRET_KS_PW"], os.environ["SECRET_KS_ALIAS"], os.environ["SECRET_KS_KEYPW"]
              print("Signing with the site release keystore (alias " + alias + ")")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("KEYSTORE_PASSWORD=" + pw + "\nKEY_ALIAS=" + alias + "\nKEY_PASSWORD=" + keypw + "\n")
          r = subprocess.run(["keytool", "-list", "-keystore", str(dest), "-storepass", pw, "-alias", alias], capture_output=True, text=True)
          if r.returncode != 0:
              print(r.stdout)
              print(r.stderr)
              sys.exit("Keystore verification failed - check the keystore alias and password.")
          PY
          python3 - <<'PY'
          import pathlib
          g = pathlib.Path("android/app/build.gradle")
          t = g.read_text()
          signing = '''
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
          '''
          # Insert the signingConfigs block just before buildTypes, then
          # attach it to the release build type — searching ONLY inside the
          # buildTypes section. (Searching the whole file is a bug: the
          # first "release {" in the file is the one inside the freshly
          # inserted signingConfigs block itself, which produced the Gradle
          # error "Could not find method signingConfig() ... on SigningConfig".)
          assert "    buildTypes {" in t
          t = t.replace("    buildTypes {", signing + "    buildTypes {", 1)
          head, sep, tail = t.partition("    buildTypes {")
          assert "release {" in tail
          tail = tail.replace("release {", "release {\n            signingConfig signingConfigs.release", 1)
          t = head + sep + tail
          g.write_text(t)
          PY
        env:
          BUILDS_DIR: ${{ github.workspace }}/builds/${{ inputs.build_id }}
          KS_DEST: android/app/release.keystore
          SECRET_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KS_KEYPW: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK
        shell: bash
        working-directory: work/android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release-${{ inputs.build_id }}.apk"
          # Prove the APK is really signed before uploading it.
          # build-tools version varies by runner image, so locate apksigner
          # instead of hardcoding e.g. build-tools/34.0.0 (which may not exist).
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/app-release-${{ inputs.build_id }}.apk" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.build_id }}
          path: app-release-${{ inputs.build_id }}.apk
          retention-days: 7

      - name: Notify build webhook
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, urllib.request
          builds = pathlib.Path(os.environ["BUILDS_DIR"])
          cfg = {}
          cp = builds / "__config.json"
          if cp.exists():
              cfg = json.loads(cp.read_text())
          url = cfg.get("webhookUrl") or ""
          if not url:
              print("No build webhook configured")
              raise SystemExit(0)
          payload = {
              "event": "build_finished",
              "buildId": os.environ["BUILD_ID"],
              "status": os.environ["JOB_STATUS"],
              "appName": os.environ["APP_NAME"],
              "packageName": os.environ["PKG"],
              "projectType": os.environ["PTYPE"],
              "runUrl": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json", "User-Agent": "ar-apk-build-webhook"})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print("Webhook delivered:", r.status)
          except Exception as e:
              print("Webhook delivery failed:", e)
          PYEOF
        env:
          BUILDS_DIR: ${{ github.workspace }}/builds/${{ inputs.build_id }}
          BUILD_ID: ${{ inputs.build_id }}
          JOB_STATUS: ${{ job.status }}
          APP_NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package_name }}
          PTYPE: ${{ inputs.project_type }}

      - name: Clean up delivered project files
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          build_id = os.environ["BUILD_ID"]
          def api(method, path, payload=None):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  method=method,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "ar-apk-build-cleanup"})
              try:
                  with urllib.request.urlopen(req) as r:
                      body = r.read().decode()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise
          def delete_tree(path):
              items = api("GET", f"/repos/{repo}/contents/{path}?ref=main")
              if items is None:
                  return
              for it in items:
                  if it["type"] == "dir":
                      delete_tree(it["path"])
                  else:
                      api("DELETE", f"/repos/{repo}/contents/{it['path']}",
                          {"message": f"cleanup build files {build_id}", "sha": it["sha"]})
          delete_tree(f"builds/{build_id}")
          print("cleanup done")
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}

  build-native:
    if: ${{ inputs.project_type == 'native' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort -V | tail -n 1)
          [ -n "$SDKMANAGER" ] || { echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; }
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"
          # Target SDK chosen in the build form (default 34).
          TGT=$(python3 -c "import json;print(json.load(open('$GITHUB_WORKSPACE/builds/$BUILD_ID/__config.json')).get('targetSdk',34))" 2>/dev/null || echo 34)
          if [ "$TGT" != "34" ]; then "$SDKMANAGER" "platforms;android-$TGT" "build-tools;$TGT.0.0"; fi
        env:
          BUILD_ID: ${{ inputs.build_id }}

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.2"

      - name: Scaffold native project
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import json, os, re, shutil, sys, urllib.request
          from pathlib import Path

          build_id = os.environ["BUILD_ID"]
          pkg = os.environ["PKG"]
          app_name = os.environ["APP_NAME"]
          vname = os.environ["VNAME"]
          vcode = os.environ["VCODE"]
          lang = os.environ["LANG"]
          perms = [x.strip() for x in os.environ.get("PERMS", "").split(",") if x.strip()]
          icon_url = os.environ.get("ICON_URL", "")

          src_dir = Path("builds") / build_id
          if not src_dir.is_dir():
              print(f"ERROR: no project files found at builds/{build_id}")
              sys.exit(1)
          # Build-form settings committed by the Worker (__config.json).
          cfg = {}
          cfg_path = src_dir / "__config.json"
          if cfg_path.exists():
              cfg = json.loads(cfg_path.read_text())
          min_sdk = int(cfg.get("minSdk", 24))
          target_sdk = int(cfg.get("targetSdk", 34))
          orient = cfg.get("orientation", "auto")
          minify = bool(cfg.get("minify", False))
          print("Build config: minSdk", min_sdk, "targetSdk", target_sdk, "orientation", orient, "minify", minify)
          all_files = [p for p in src_dir.rglob("*") if p.is_file()]
          print("Project files:", [str(p.relative_to(src_dir)) for p in all_files])

          sources = [p for p in all_files if p.suffix in (".kt", ".java")]
          if not sources:
              print("ERROR: a native project needs at least one .kt or .java source file")
              sys.exit(1)

          work = Path("work")
          app = work / "app"
          pkg_path = pkg.replace(".", "/")
          java_dir = app / "src/main/java" / pkg_path
          java_dir.mkdir(parents=True, exist_ok=True)
          res_dir = app / "src/main/res"
          (res_dir / "values").mkdir(parents=True, exist_ok=True)

          # --- sources (flattened into the package folder) ---
          seen = set()
          for s in sources:
              if s.name in seen:
                  print("WARN: duplicate source name skipped:", s.name)
                  continue
              seen.add(s.name)
              shutil.copy(s, java_dir / s.name)

          # --- extra res/ files the project shipped (layouts, drawables...) ---
          for p in all_files:
              rel = p.relative_to(src_dir)
              parts = rel.parts
              if "res" in parts:
                  idx = parts.index("res")
                  dest = res_dir.joinpath(*parts[idx + 1:])
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy(p, dest)

          # --- everything else the project shipped becomes app assets ---
          # (e.g. a www/ web root served through WebViewAssetLoader, keeping
          #  the project's own folder structure under assets/)
          assets_dir = app / "src/main/assets"
          skip_names = {"AndroidManifest.xml", "settings.gradle", "gradle.properties",
                        "build.gradle", "build.gradle.kts", ".gitignore",
                        "gradlew", "gradlew.bat"}
          for p in all_files:
              rel = p.relative_to(src_dir)
              parts = rel.parts
              if p.suffix in (".kt", ".java"):
                  continue
              if p.name.startswith("__"):
                  continue
              if "res" in parts or p.name in skip_names:
                  continue
              if parts[0] == "assets" and len(parts) > 1:
                  rel = Path(*parts[1:])
              dest = assets_dir / rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy(p, dest)
          if assets_dir.is_dir():
              print("Assets bundled:", sorted(str(p.relative_to(assets_dir)) for p in assets_dir.rglob("*") if p.is_file()))

          # --- detect the launcher activity class ---
          main_cls = None
          act_re = re.compile(r"class\s+(\w+)\s*:\s*(?:[\w.]+\.)?(AppCompatActivity|ComponentActivity|Activity)\s*\(")
          java_act_re = re.compile(r"class\s+(\w+)\s+extends\s+(?:[\w.]+\.)?(AppCompatActivity|ComponentActivity|Activity)\b")
          for s in sources:
              text = s.read_text(errors="ignore")
              m = act_re.search(text) or java_act_re.search(text)
              if m:
                  main_cls = m.group(1)
                  break
          if not main_cls:
              for s in sources:
                  if s.stem == "MainActivity":
                      main_cls = "MainActivity"
                      break
          if not main_cls:
              m = re.search(r"class\s+(\w+)", sources[0].read_text(errors="ignore"))
              main_cls = m.group(1) if m else "MainActivity"
          print("Launcher activity:", main_cls)

          # --- permissions the code itself asks for (Manifest.permission.X) ---
          for s in sources:
              text = s.read_text(errors="ignore")
              for m in re.finditer(r"Manifest\.permission\.([A-Z_]+)", text):
                  p = "android.permission." + m.group(1)
                  if p not in perms:
                      perms.append(p)
              for m in re.finditer(r'"android\.permission\.([A-Z_]+)"', text):
                  p = "android.permission." + m.group(1)
                  if p not in perms:
                      perms.append(p)
          print("Manifest permissions:", perms)

          # --- AndroidManifest.xml ---
          manifest_src = None
          for p in all_files:
              if p.name == "AndroidManifest.xml":
                  manifest_src = p
                  break
          if manifest_src is not None:
              text = manifest_src.read_text()
              # AGP 8 takes the package from the Gradle namespace instead.
              text = re.sub(r'\s+package="[^"]*"', "", text, count=1)
              if orient in ("portrait", "landscape") and "screenOrientation" not in text:
                  m = re.search(r"<activity\b[^>]*>(?:(?!</activity>).)*?LAUNCHER", text, re.S)
                  if m:
                      pos = m.start() + len("<activity")
                      text = text[:pos] + ' android:screenOrientation="' + orient + '"' + text[pos:]
                  elif "<activity" in text:
                      pos = text.index("<activity") + len("<activity")
                      text = text[:pos] + ' android:screenOrientation="' + orient + '"' + text[pos:]
                  print("Orientation locked on the project's own manifest:", orient)
              (app / "src/main/AndroidManifest.xml").write_text(text)
              print("Using the project's own AndroidManifest.xml")
          else:
              def perm_tag(x):
                  extra = ' android:maxSdkVersion="28"' if x == "android.permission.WRITE_EXTERNAL_STORAGE" else ""
                  return f'    <uses-permission android:name="{x}"{extra} />\n'
              perm_lines = "".join(perm_tag(x) for x in perms)
              orient_attr = f'\n            android:screenOrientation="{orient}"' if orient in ("portrait", "landscape") else ""
              manifest = f'''<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          {perm_lines}    <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@style/AppTheme"
                  android:allowBackup="true"
                  android:supportsRtl="true">
                  <activity
                      android:name=".{main_cls}"{orient_attr}
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          '''
              (app / "src/main/AndroidManifest.xml").write_text(manifest)

          # --- resources ---
          esc = app_name.replace("&", "&amp;").replace("<", "&lt;").replace('"', "&quot;")
          (res_dir / "values/strings.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              f'    <string name="app_name">{esc}</string>\n</resources>\n')
          (res_dir / "values/themes.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
              '    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar" />\n</resources>\n')

          # --- splash screen (uploaded image -> windowBackground drawable) ---
          splash_file = src_dir / "__splash.img"
          if splash_file.exists():
              from PIL import Image as PILImage
              simg = PILImage.open(splash_file).convert("RGB")
              (res_dir / "drawable").mkdir(parents=True, exist_ok=True)
              simg.resize((480, 800)).save(res_dir / "drawable" / "splash.png")
              (res_dir / "drawable" / "splash_bg.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n'
                  '<layer-list xmlns:android="http://schemas.android.com/apk/res/android">\n'
                  '    <item android:drawable="@android:color/white" />\n'
                  '    <item>\n'
                  '        <bitmap android:gravity="center" android:src="@drawable/splash" />\n'
                  '    </item>\n'
                  '</layer-list>\n')
              themes = (res_dir / "values/themes.xml").read_text()
              themes = themes.replace("</style>",
                  '    <item name="android:windowBackground">@drawable/splash_bg</item>\n    </style>', 1)
              (res_dir / "values/themes.xml").write_text(themes)
              print("Splash screen applied")

          # --- launcher icons ---
          from PIL import Image
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          icon_file = src_dir / "__icon.img"
          if icon_file.exists():
              src_img = Image.open(icon_file).convert("RGBA")
          elif icon_url:
              urllib.request.urlretrieve(icon_url, "/tmp/icon.png")
              src_img = Image.open("/tmp/icon.png").convert("RGBA")
          else:
              src_img = Image.new("RGBA", (512, 512), (37, 99, 235, 255))
          for dpi, px in sizes.items():
              d = res_dir / f"mipmap-{dpi}"
              d.mkdir(parents=True, exist_ok=True)
              img = src_img.resize((px, px))
              img.save(d / "ic_launcher.png")
              img.save(d / "ic_launcher_round.png")

          # --- Gradle files ---
          (work / "settings.gradle").write_text(
              "rootProject.name = 'app'\ninclude ':app'\n")
          (work / "gradle.properties").write_text(
              "android.useAndroidX=true\nandroid.nonTransitiveRClass=true\n"
              "kotlin.code.style=official\norg.gradle.jvmargs=-Xmx2g\n")
          (work / "build.gradle").write_text('''// Top-level build file (AR APK BUILD native scaffold)
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
                  classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          tasks.register('clean', Delete) { delete rootProject.buildDir }
          ''')
          kotlin_plugin = "apply plugin: 'kotlin-android'\n" if lang == "kotlin" else ""
          kotlin_options = ("    kotlinOptions { jvmTarget = '17' }\n" if lang == "kotlin" else "")
          kotlin_deps = "    implementation 'androidx.core:core-ktx:1.12.0'\n" if lang == "kotlin" else ""
          dep_map = {"androidx.webkit.": "    implementation 'androidx.webkit:webkit:1.8.0'\n"}
          all_src = "\n".join(s.read_text(errors="ignore") for s in sources)
          extra_deps = "".join(dep for prefix, dep in dep_map.items() if prefix in all_src)
          if extra_deps:
              print("Extra dependencies added:", extra_deps.strip())
          (app / "build.gradle").write_text(f'''apply plugin: 'com.android.application'
          {kotlin_plugin}android {{
              namespace '{pkg}'
              compileSdk {target_sdk}
              defaultConfig {{
                  applicationId '{pkg}'
                  minSdk {min_sdk}
                  targetSdk {target_sdk}
                  versionCode {vcode}
                  versionName '{vname}'
              }}
              signingConfigs {{
                  release {{
                      storeFile file('release.keystore')
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                  }}
              }}
              buildTypes {{
                  release {{
                      signingConfig signingConfigs.release
                      minifyEnabled {'true' if minify else 'false'}
                  }}
              }}
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          {kotlin_options}}}
          dependencies {{
              implementation 'androidx.appcompat:appcompat:1.6.1'
          {kotlin_deps}{extra_deps}}}
          ''')
          print("Native scaffold ready:", pkg, lang, "activity", main_cls)
          PY
        env:
          BUILD_ID: ${{ inputs.build_id }}
          PKG: ${{ inputs.package_name }}
          APP_NAME: ${{ inputs.app_name }}
          VNAME: ${{ inputs.version_name }}
          VCODE: ${{ inputs.version_code }}
          LANG: ${{ inputs.language }}
          PERMS: ${{ inputs.permissions }}
          ICON_URL: ${{ inputs.icon_url }}

      - name: Decode release keystore
        shell: bash
        run: |
          set -euo pipefail
          # User's own keystore when the build form sent one, else the site
          # release keystore from Secrets. Credentials go to $GITHUB_ENV for
          # the Gradle step; the keystore is verified here with a clear
          # error instead of a cryptic signing failure later.
          python3 - <<'PY'
          import base64, json, os, pathlib, subprocess, sys
          builds = pathlib.Path(os.environ["BUILDS_DIR"])
          cfg = {}
          cp = builds / "__config.json"
          if cp.exists():
              cfg = json.loads(cp.read_text())
          dest = pathlib.Path(os.environ["KS_DEST"])
          if cfg.get("keystoreMode") == "own" and (builds / "__keystore.bin").exists():
              ks = json.loads((builds / "__ks.json").read_text())
              dest.write_bytes((builds / "__keystore.bin").read_bytes())
              pw, alias, keypw = ks["storePassword"], ks["alias"], ks.get("keyPassword") or ks["storePassword"]
              print("Signing with the user's own keystore (alias " + alias + ")")
          else:
              dest.write_bytes(base64.b64decode("".join(os.environ["SECRET_KS_B64"].split())))
              pw, alias, keypw = os.environ["SECRET_KS_PW"], os.environ["SECRET_KS_ALIAS"], os.environ["SECRET_KS_KEYPW"]
              print("Signing with the site release keystore (alias " + alias + ")")
          with open(os.environ["GITHUB_ENV"], "a") as fh:
              fh.write("KEYSTORE_PASSWORD=" + pw + "\nKEY_ALIAS=" + alias + "\nKEY_PASSWORD=" + keypw + "\n")
          r = subprocess.run(["keytool", "-list", "-keystore", str(dest), "-storepass", pw, "-alias", alias], capture_output=True, text=True)
          if r.returncode != 0:
              print(r.stdout)
              print(r.stderr)
              sys.exit("Keystore verification failed - check the keystore alias and password.")
          PY
        env:
          BUILDS_DIR: ${{ github.workspace }}/builds/${{ inputs.build_id }}
          KS_DEST: work/app/release.keystore
          SECRET_KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          SECRET_KS_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          SECRET_KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          SECRET_KS_KEYPW: ${{ secrets.KEY_PASSWORD }}

      - name: Build release APK (native)
        shell: bash
        run: |
          set -euo pipefail
          cd work
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/app-release-${{ inputs.build_id }}.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f | sort -V | tail -n 1)
          [ -n "$APKSIGNER" ] || { echo "apksigner not found under $ANDROID_HOME/build-tools"; exit 1; }
          "$APKSIGNER" verify --print-certs "$GITHUB_WORKSPACE/app-release-${{ inputs.build_id }}.apk" | head -5

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.build_id }}
          path: app-release-${{ inputs.build_id }}.apk
          retention-days: 7

      - name: Notify build webhook
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PYEOF'
          import json, os, pathlib, urllib.request
          builds = pathlib.Path(os.environ["BUILDS_DIR"])
          cfg = {}
          cp = builds / "__config.json"
          if cp.exists():
              cfg = json.loads(cp.read_text())
          url = cfg.get("webhookUrl") or ""
          if not url:
              print("No build webhook configured")
              raise SystemExit(0)
          payload = {
              "event": "build_finished",
              "buildId": os.environ["BUILD_ID"],
              "status": os.environ["JOB_STATUS"],
              "appName": os.environ["APP_NAME"],
              "packageName": os.environ["PKG"],
              "projectType": os.environ["PTYPE"],
              "runUrl": "https://github.com/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
          }
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json", "User-Agent": "ar-apk-build-webhook"})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print("Webhook delivered:", r.status)
          except Exception as e:
              print("Webhook delivery failed:", e)
          PYEOF
        env:
          BUILDS_DIR: ${{ github.workspace }}/builds/${{ inputs.build_id }}
          BUILD_ID: ${{ inputs.build_id }}
          JOB_STATUS: ${{ job.status }}
          APP_NAME: ${{ inputs.app_name }}
          PKG: ${{ inputs.package_name }}
          PTYPE: ${{ inputs.project_type }}

      - name: Clean up delivered project files
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          build_id = os.environ["BUILD_ID"]
          def api(method, path, payload=None):
              req = urllib.request.Request(
                  "https://api.github.com" + path,
                  method=method,
                  data=json.dumps(payload).encode() if payload is not None else None,
                  headers={"Authorization": "Bearer " + token,
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "User-Agent": "ar-apk-build-cleanup"})
              try:
                  with urllib.request.urlopen(req) as r:
                      body = r.read().decode()
                      return json.loads(body) if body else {}
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      return None
                  raise
          def delete_tree(path):
              items = api("GET", f"/repos/{repo}/contents/{path}?ref=main")
              if items is None:
                  return
              for it in items:
                  if it["type"] == "dir":
                      delete_tree(it["path"])
                  else:
                      api("DELETE", f"/repos/{repo}/contents/{it['path']}",
                          {"message": f"cleanup build files {build_id}", "sha": it["sha"]})
          delete_tree(f"builds/{build_id}")
          print("cleanup done")
          PY
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_ID: ${{ inputs.build_id }}
