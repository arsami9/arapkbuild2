# AR APK BUILD — Real Release APK builder
# Triggered via workflow_dispatch by the Cloudflare Worker (which first
# verifies the caller's Firebase ID token). Builds a Capacitor WebView app
# and signs the release APK with the keystore stored in repo Secrets.
# Required repo Secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64    base64 of your release keystore (.jks / .keystore)
#   KEYSTORE_PASSWORD  keystore password
#   KEY_ALIAS          key alias inside the keystore
#   KEY_PASSWORD       key password
# NO secrets are ever committed to this repo.
name: build-apk
run-name: build-${{ inputs.build_id }}
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID generated by the Worker"
        required: true
        type: string
      app_name:
        description: "App display name"
        required: true
        type: string
      package_name:
        description: "Android package / Capacitor appId, e.g. com.company.app"
        required: true
        type: string
      start_url:
        description: "WebView start URL the app loads"
        required: true
        type: string
      version_name:
        description: "versionName, e.g. 1.0.0"
        required: true
        type: string
      version_code:
        description: "versionCode integer"
        required: true
        type: string
      app_icon:
        description: "App icon PNG (base64), optional"
        required: false
        type: string
      app_label:
        description: "App label / title shown in the app, optional"
        required: false
        type: string

permissions:
  contents: read

env:
  APP_NAME: ${{ inputs.app_name }}
  PACKAGE_NAME: ${{ inputs.package_name }}
  START_URL: ${{ inputs.start_url }}
  VERSION_NAME: ${{ inputs.version_name }}
  VERSION_CODE: ${{ inputs.version_code }}
  APP_ICON_B64: ${{ inputs.app_icon }}
  APP_LABEL: ${{ inputs.app_label }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Create Capacitor project
        run: |
          npx cap init "$APP_NAME" "$PACKAGE_NAME" --web-dir=dist
          npx cap add android

      - name: Build web assets
        run: npm run build

      - name: Copy web assets to native
        run: npx cap sync android

      - name: Write Capacitor config (Capacitor 7: config file is TS)
        run: |
          cat > capacitor.config.ts << 'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';
          const config: CapacitorConfig = {
            appId: process.env.PACKAGE_NAME,
            appName: process.env.APP_NAME,
            webDir: 'dist',
            server: { url: process.env.START_URL, cleartext: true }
          };
          export default config;
          EOF
          npx cap sync android

      - name: Write web manifest + index title
        run: |
          node - << 'NODE'
          const fs = require('fs');
          const path = require('path');
          const html = fs.readFileSync(path.join('dist', 'index.html'), 'utf8');
          fs.writeFileSync(path.join('dist', 'index.html'), html.replace(/<title>.*?<\/title>/i, `<title>${process.env.APP_LABEL || process.env.APP_NAME}</title>`));
          const manifest = { name: process.env.APP_LABEL || process.env.APP_NAME, short_name: process.env.APP_LABEL || process.env.APP_NAME, start_url: process.env.START_URL, display: 'standalone', background_color: '#ffffff', theme_color: '#ffffff' };
          fs.writeFileSync(path.join('dist', 'manifest.webmanifest'), JSON.stringify(manifest, null, 2));
          NODE
          npx cap sync android

      - name: Write index title fallback
        run: |
          python3 - << 'PY'
          import re, pathlib
          p = pathlib.Path('android/app/src/main/assets/public/index.html')
          text = p.read_text()
          text = re.sub(r'<title>.*?</title>', '<title>' + (os.environ.get('APP_LABEL') or os.environ.get('APP_NAME')) + '</title>', text, flags=re.IGNORECASE | re.DOTALL)
          p.write_text(text)
          PY

      - name: Set package, label, version, icon
        run: |
          python3 - << 'PY'
          import os, pathlib, re, shutil
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = re.sub(r'package="[^"]+"', 'package="' + os.environ['PACKAGE_NAME'] + '"', text, count=1)
          manifest.write_text(text)
          build_gradle = pathlib.Path('android/app/build.gradle')
          text = build_gradle.read_text()
          text = text.replace('applicationId "com.example.app"', 'applicationId "' + os.environ['PACKAGE_NAME'] + '"')
          text = re.sub(r'versionCode \d+', 'versionCode ' + os.environ['VERSION_CODE'], text)
          text = re.sub(r'versionName "[^"]+"', 'versionName "' + os.environ['VERSION_NAME'] + '"', text)
          build_gradle.write_text(text)
          strings = pathlib.Path('android/app/src/main/res/values/strings.xml')
          text = strings.read_text()
          text = re.sub(r'<string name="app_name">.*?</string>', '<string name="app_name">' + (os.environ.get('APP_LABEL') or os.environ.get('APP_NAME')) + '</string>', text, flags=re.DOTALL)
          strings.write_text(text)
          icon_b64 = os.environ.get('APP_ICON_B64')
          if icon_b64:
              data = base64.b64decode(icon_b64)
              for d in ['mipmap-mdpi', 'mipmap-hdpi', 'mipmap-xhdpi', 'mipmap-xxhdpi', 'mipmap-xxxhdpi']:
                  pathlib.Path(f'android/app/src/main/res/{d}/ic_launcher.png').write_bytes(data)
                  pathlib.Path(f'android/app/src/main/res/{d}/ic_launcher_round.png').write_bytes(data)
          PY

      - name: Inject release signing config
        run: |
          python3 - << 'PY'
          import pathlib
          p = pathlib.Path('android/app/build.gradle')
          text = p.read_text()
          if 'signingConfigs' not in text:
              text = text.replace('android {', 'android {\n    signingConfigs {\n        release {\n            storeFile file("release.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }', 1)
              text = text.replace('buildTypes {', 'buildTypes {\n        release {\n            signingConfig signingConfigs.release\n        }', 1)
          p.write_text(text)
          PY
          # Decode tolerantly (any stray whitespace from secret entry is
          # stripped first), then prove the result is the real keystore —
          # a truncated/corrupt secret fails HERE with a clear message
          # instead of surfacing as a cryptic signing error later.
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '[:space:]' | base64 -d > android/app/release.keystore
          keytool -list -keystore android/app/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build release APK
        run: ./gradlew -p android assembleRelease

      - name: Verify APK was built
        run: |
          ls -lh android/app/build/outputs/apk/release/
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ inputs.build_id }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
