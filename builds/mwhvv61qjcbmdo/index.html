<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Snake 3D — Cartoon Adventure</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <!-- HUD -->
  <div id="hud">
    <div class="pill" id="hudScore">🍎 0</div>
    <div class="pill" id="hudBest">🏆 0</div>
    <div class="pill" id="hudLen">🐍 3</div>
    <div class="hudBtns">
      <button class="iconBtn" id="btnSound" aria-label="Sound">🔊</button>
      <button class="iconBtn" id="btnPause" aria-label="Pause">⏸</button>
    </div>
  </div>

  <!-- Main menu -->
  <div class="overlay" id="menu">
    <div class="card">
      <div class="logo">🐍</div>
      <h1>SNAKE <span>3D</span></h1>
      <p class="tag">Cartoon Adventure</p>
      <p class="desc">Eat the apples, grow longer and longer —<br>but don't bite yourself or hit the hedge!</p>
      <button class="bigBtn" id="btnPlay">▶ &nbsp;Play</button>
      <p class="bestLine" id="menuBest">🏆 Best: 0</p>
      <div class="how">
        <p>📱 <b>Swipe</b> or use the <b>arrow pad</b> to steer</p>
        <p>⌨️ Desktop: Arrow keys / WASD</p>
        <p>🍎 Apple = 10 pts &nbsp;•&nbsp; ⭐ Golden apple = 50 pts</p>
      </div>
    </div>
  </div>

  <!-- Game over -->
  <div class="overlay hidden" id="over">
    <div class="card">
      <div class="logo">💫</div>
      <h2>Game Over!</h2>
      <p class="finalScore" id="finalScore">Score: 0</p>
      <p class="bestLine" id="finalBest">🏆 Best: 0</p>
      <button class="bigBtn" id="btnAgain">↻ &nbsp;Play Again</button>
    </div>
  </div>

  <div id="pausedTag" class="hidden">⏸ Paused</div>

  <!-- On-screen direction pad (touch devices) -->
  <div id="dpad">
    <button class="padBtn" data-dir="up" style="grid-area:1/2">▲</button>
    <button class="padBtn" data-dir="left" style="grid-area:2/1">◀</button>
    <button class="padBtn" data-dir="down" style="grid-area:2/2">▼</button>
    <button class="padBtn" data-dir="right" style="grid-area:2/3">▶</button>
  </div>
</div>
<script src="js/game.js"></script>
</body>
</html>
